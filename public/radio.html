<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio Calico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --mint: #D8F2D5;
      --forest: #1F4E23;
      --teal: #38A29D;
      --orange: #EFA63C;
      --charcoal: #231F20;
      --cream: #F5EADA;
      --white: #FFFFFF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Open Sans", -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--white);
      color: var(--charcoal);
      line-height: 1.6;
    }

    h1, h2, h3 {
      font-family: "Montserrat", -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* Header / nav bar */
    header {
      background: var(--teal);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    header img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }

    header .brand {
      font-family: "Montserrat", sans-serif;
      font-weight: 700;
      font-size: 1.5rem;
      color: var(--white);
      letter-spacing: 0.02em;
    }

    header .brand .accent {
      color: var(--mint);
    }

    /* Main layout */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 64px 24px;
    }

    .now-playing {
      display: grid;
      grid-template-columns: minmax(240px, 360px) 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 700px) {
      .now-playing {
        grid-template-columns: 1fr;
      }
    }

    .album-art {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 8px;
      background: linear-gradient(160deg, var(--teal), var(--forest));
      object-fit: cover;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    .track-info h1 {
      font-weight: 700;
      font-size: 2rem;
      line-height: 1.2;
      color: var(--charcoal);
      margin-bottom: 8px;
    }

    .track-info h2 {
      font-weight: 600;
      font-size: 1.25rem;
      line-height: 1.3;
      color: var(--forest);
      margin-bottom: 24px;
    }

    .quality-info {
      font-size: 0.875rem;
      color: var(--charcoal);
      opacity: 0.75;
      font-style: italic;
      margin-bottom: 4px;
    }

    .rating {
      margin-top: 24px;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .rating button {
      background: none;
      border: none;
      font-size: 1.25rem;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      line-height: 1;
    }

    .rating button:hover {
      background: var(--mint);
    }

    .rating button.active {
      background: var(--mint);
    }

    .rating button:disabled {
      cursor: default;
      opacity: 0.6;
    }

    .rating button:disabled:hover {
      background: none;
    }

    .rating button.active:disabled:hover {
      background: var(--mint);
    }

    .rating .count {
      font-size: 0.8rem;
      opacity: 0.8;
      margin-left: 2px;
    }

    /* Player card */
    .player-card {
      margin-top: 24px;
      background: var(--charcoal);
      border-radius: 8px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .play-button {
      background: var(--mint);
      color: var(--forest);
      border: none;
      width: 44px;
      height: 44px;
      min-width: 44px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .play-button:hover {
      background: var(--teal);
      color: var(--white);
    }

    .status-time {
      color: var(--white);
      font-size: 0.875rem;
      min-width: 90px;
    }

    .status-time .status {
      display: block;
      opacity: 0.85;
    }

    .status-time .status.error {
      color: var(--orange);
    }

    .volume-control {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 160px;
      color: var(--white);
    }

    .volume-control input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.3);
      outline: none;
    }

    .volume-control input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--teal);
      cursor: pointer;
    }

    .volume-control input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border: none;
      border-radius: 50%;
      background: var(--teal);
      cursor: pointer;
    }

    .volume-control .volume-level {
      font-size: 0.75rem;
      min-width: 36px;
      opacity: 0.85;
    }

    /* Previous tracks */
    .previous-tracks {
      background: var(--mint);
      margin-top: 64px;
      padding: 48px 24px;
      border-radius: 8px;
    }

    .previous-tracks h3 {
      font-weight: 500;
      font-size: 1.5rem;
      color: var(--forest);
      margin-bottom: 16px;
    }

    .previous-tracks ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .previous-tracks li {
      font-size: 1rem;
      color: var(--charcoal);
    }

    .previous-tracks .artist {
      font-weight: 600;
    }

    .previous-tracks .song {
      font-style: italic;
    }

    .previous-tracks .empty-message {
      font-style: italic;
      opacity: 0.7;
    }

    .link-to-home {
      text-align: center;
      margin-top: 48px;
    }

    .link-to-home a {
      color: var(--forest);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
    }

    .link-to-home a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <img src="/radio-calico-logo.png" alt="Radio Calico logo">
    <span class="brand">Radio <span class="accent">Calico</span></span>
  </header>

  <main>
    <div class="now-playing">
      <img id="albumArt" class="album-art" alt="Album art">

      <div class="track-info">
        <h1 id="trackTitle">Loading track info…</h1>
        <h2 id="trackAlbum"></h2>

        <p class="quality-info" id="sourceQuality">Source quality: —</p>
        <p class="quality-info" id="streamQuality">Stream quality: 48kHz FLAC / HLS Lossless</p>

        <div class="rating">
          <span>Rate this track:</span>
          <button type="button" id="thumbsUpButton" aria-label="Thumbs up" onclick="rateTrack('up')">👍 <span class="count" id="thumbsUpCount">0</span></button>
          <button type="button" id="thumbsDownButton" aria-label="Thumbs down" onclick="rateTrack('down')">👎 <span class="count" id="thumbsDownCount">0</span></button>
        </div>

        <div class="player-card">
          <button id="playButton" class="play-button" onclick="togglePlayPause()">▶</button>

          <div class="status-time">
            <span id="status" class="status">Initializing...</span>
            <span id="timeDisplay" title="Elapsed time on this track">Elapsed: --:--</span>
          </div>

          <div class="volume-control">
            <span aria-hidden="true">🔊</span>
            <input type="range" id="volume" min="0" max="100" value="100" onchange="setVolume()">
            <span id="volumeLevel" class="volume-level">100%</span>
          </div>

          <audio id="player" crossorigin="anonymous"></audio>
        </div>
      </div>
    </div>

    <div class="previous-tracks">
      <h3>Previous tracks:</h3>
      <ul id="previousTracksList">
        <li class="empty-message">Keep listening — tracks will appear here as they play.</li>
      </ul>
    </div>

    <div class="link-to-home">
      <a href="/">← Back to prototype</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const MASTER_URL = 'https://d3d4yli4hf5bmh.cloudfront.net/hls/live.m3u8';
    // Chrome/Firefox's Media Source Extensions (used by hls.js) do not reliably
    // decode FLAC-in-fMP4, so hls.js is pointed at the AAC variant directly.
    // Only Safari's native (non-MSE) HLS player gets the lossless FLAC stream.
    const AAC_URL = 'https://d3d4yli4hf5bmh.cloudfront.net/hls/aac_hifi.m3u8';
    const audio = document.getElementById('player');
    const playButton = document.getElementById('playButton');
    const statusEl = document.getElementById('status');
    const volumeSlider = document.getElementById('volume');
    const volumeLevel = document.getElementById('volumeLevel');
    const timeDisplay = document.getElementById('timeDisplay');

    let hls = null;
    let isPlaying = false;

    // The HLS stream is live — audio.currentTime/duration are live-buffer
    // positions, not per-song values, and the stream exposes no song length.
    // Elapsed time is tracked independently, reset whenever metadata polling
    // detects the track has changed.
    let trackElapsedBaseline = 0;
    let trackResumedAt = null;

    function trackElapsedSeconds() {
      if (trackResumedAt === null) return trackElapsedBaseline;
      return trackElapsedBaseline + (Date.now() - trackResumedAt) / 1000;
    }

    function resetTrackElapsed() {
      trackElapsedBaseline = 0;
      trackResumedAt = isPlaying ? Date.now() : null;
    }

    function updateStatus(message, className = '') {
      statusEl.textContent = message;
      statusEl.className = 'status ' + className;
    }

    function initializeStream() {
      updateStatus('Initializing stream...', 'loading');

      if (audio.canPlayType('application/vnd.apple.mpegurl') === 'probably') {
        audio.src = MASTER_URL;
        updateStatus('Ready (native HLS, lossless FLAC)', 'loading');
      } else if (Hls.isSupported()) {
        hls = new Hls({
          debug: true,
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 90,
          maxBufferLength: 120
        });
        window.hls = hls;

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          updateStatus('Stream ready', 'loading');
          console.log('HLS manifest parsed, duration:', audio.duration);
        });

        hls.on(Hls.Events.LEVEL_SWITCHED, () => {
          const levelDetails = hls.levels[hls.currentLevel];
          if (levelDetails) {
            updateStatus(`Playing (${levelDetails.name || 'HLS'})`, '');
            console.log('Level switched:', levelDetails);
          }
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          console.error('HLS error:', data.type, data.details, data.fatal, data);
          if (data.fatal) {
            switch(data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                updateStatus('Network error - retrying...', 'error');
                hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                updateStatus('Live stream advanced - reloading...', 'error');
                audio.currentTime = 0;
                hls.recoverMediaError();
                setTimeout(() => {
                  hls.startLoad();
                }, 500);
                break;
              default:
                updateStatus('Stream error: ' + (data.response?.statusText || data.details || 'unknown'), 'error');
                break;
            }
          } else if (data.details === 'bufferStalledError') {
            console.warn('Buffer stalled (non-fatal):', data);
          }
        });

        hls.loadSource(AAC_URL);
        hls.attachMedia(audio);
        startStallWatchdog();
      } else {
        updateStatus('HLS not supported on this browser', 'error');
      }
    }

    let stallWatchdogTimer = null;
    let lastPlaybackTime = -1;
    let stalledTicks = 0;

    function startStallWatchdog() {
      if (stallWatchdogTimer) clearInterval(stallWatchdogTimer);
      lastPlaybackTime = -1;
      stalledTicks = 0;

      stallWatchdogTimer = setInterval(() => {
        if (!isPlaying) return;

        if (audio.currentTime === lastPlaybackTime) {
          stalledTicks++;
          console.warn('Watchdog: playback appears stalled at', audio.currentTime, 'tick', stalledTicks);
          if (stalledTicks >= 2) {
            console.warn('Watchdog: reloading stream after stall');
            updateStatus('Playback stalled - reloading stream...', 'error');
            stalledTicks = 0;
            if (hls) {
              hls.loadSource(AAC_URL);
              hls.attachMedia(audio);
              audio.play().catch(err => console.error('Watchdog resume failed:', err));
            } else {
              audio.load();
              audio.play().catch(err => console.error('Watchdog resume failed:', err));
            }
          }
        } else {
          stalledTicks = 0;
        }
        lastPlaybackTime = audio.currentTime;
      }, 3000);
    }

    function togglePlayPause() {
      if (isPlaying) {
        audio.pause();
        playButton.textContent = '▶';
        updateStatus('Paused', '');
        isPlaying = false;
        trackElapsedBaseline = trackElapsedSeconds();
        trackResumedAt = null;
      } else {
        audio.play();
        playButton.textContent = '❙❙';
        updateStatus('Playing', 'playing');
        isPlaying = true;
        trackResumedAt = Date.now();
      }
    }

    function setVolume() {
      const vol = parseInt(volumeSlider.value);
      audio.volume = vol / 100;
      volumeLevel.textContent = vol + '%';
    }

    function formatTime(seconds) {
      if (!isFinite(seconds) || seconds < 0) return '--:--';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    audio.addEventListener('play', () => {
      playButton.textContent = '❙❙';
      isPlaying = true;
      if (trackResumedAt === null) trackResumedAt = Date.now();
      if (statusEl.className.includes('loading')) {
        updateStatus('Playing', 'playing');
      }
    });

    audio.addEventListener('pause', () => {
      playButton.textContent = '▶';
      isPlaying = false;
      if (trackResumedAt !== null) {
        trackElapsedBaseline = trackElapsedSeconds();
        trackResumedAt = null;
      }
      if (!statusEl.textContent.includes('error')) {
        updateStatus('Paused', '');
      }
    });

    audio.addEventListener('timeupdate', () => {
      if (isPlaying) {
        timeDisplay.textContent = 'Elapsed: ' + formatTime(trackElapsedSeconds());
      }
    });

    setInterval(() => {
      if (isPlaying) {
        timeDisplay.textContent = 'Elapsed: ' + formatTime(trackElapsedSeconds());
      }
    }, 1000);

    audio.addEventListener('loadstart', () => {
      updateStatus('Loading stream...', 'loading');
    });

    audio.addEventListener('canplay', () => {
      if (!isPlaying) {
        updateStatus('Ready to play', 'loading');
      }
    });

    audio.addEventListener('error', (e) => {
      updateStatus('Audio error: ' + (e.target.error?.message || 'unknown'), 'error');
    });

    const METADATA_URL = 'https://d3d4yli4hf5bmh.cloudfront.net/metadata.json';
    const COVER_URL = 'https://d3d4yli4hf5bmh.cloudfront.net/cover.jpg';
    const albumArt = document.getElementById('albumArt');
    const trackTitleEl = document.getElementById('trackTitle');
    const trackAlbumEl = document.getElementById('trackAlbum');
    const sourceQualityEl = document.getElementById('sourceQuality');
    const previousTracksList = document.getElementById('previousTracksList');

    let lastTrackKey = null;
    let lastMeta = null;

    function trackKey(meta) {
      return `${meta.artist || ''} - ${meta.title || ''}`;
    }

    function addPreviousTrack(meta) {
      const emptyMessage = previousTracksList.querySelector('.empty-message');
      if (emptyMessage) emptyMessage.remove();

      const li = document.createElement('li');
      li.textContent = `${meta.artist || 'Unknown artist'} - ${meta.title || 'Unknown title'}`;
      previousTracksList.insertBefore(li, previousTracksList.firstChild);
    }

    async function pollMetadata() {
      try {
        const response = await fetch(METADATA_URL, { cache: 'no-store' });
        if (!response.ok) throw new Error('metadata fetch failed: ' + response.status);
        const meta = await response.json();

        const key = trackKey(meta);
        const trackChanged = lastTrackKey === null || key !== lastTrackKey;
        if (lastTrackKey !== null && key !== lastTrackKey) {
          addPreviousTrack(lastMeta);
        }
        lastTrackKey = key;
        lastMeta = meta;

        if (trackChanged) {
          refreshRatings(meta);
          resetTrackElapsed();
        }

        trackTitleEl.textContent = meta.title || 'Unknown title';
        trackAlbumEl.textContent = [meta.album, meta.date].filter(Boolean).join(' • ');
        if (meta.bit_depth && meta.sample_rate) {
          const khz = meta.sample_rate / 1000;
          sourceQualityEl.textContent = `Source quality: ${meta.bit_depth}-bit / ${khz}kHz`;
        }
        albumArt.src = COVER_URL + '?t=' + Date.now();
      } catch (error) {
        console.error('Error fetching metadata:', error);
      }
    }

    const thumbsUpButton = document.getElementById('thumbsUpButton');
    const thumbsDownButton = document.getElementById('thumbsDownButton');
    const thumbsUpCountEl = document.getElementById('thumbsUpCount');
    const thumbsDownCountEl = document.getElementById('thumbsDownCount');

    function getClientId() {
      let id = localStorage.getItem('radiocalico_client_id');
      if (!id) {
        id = crypto.randomUUID();
        localStorage.setItem('radiocalico_client_id', id);
      }
      return id;
    }
    const clientId = getClientId();

    function updateRatingDisplay(counts) {
      thumbsUpCountEl.textContent = counts.thumbs_up ?? 0;
      thumbsDownCountEl.textContent = counts.thumbs_down ?? 0;
      thumbsUpButton.classList.toggle('active', counts.voted === 'up');
      thumbsDownButton.classList.toggle('active', counts.voted === 'down');
      thumbsUpButton.disabled = !!counts.voted;
      thumbsDownButton.disabled = !!counts.voted;
    }

    async function refreshRatings(meta) {
      thumbsUpButton.disabled = false;
      thumbsDownButton.disabled = false;
      thumbsUpButton.classList.remove('active');
      thumbsDownButton.classList.remove('active');
      if (!meta.artist || !meta.title) return;
      try {
        const params = new URLSearchParams({ artist: meta.artist, title: meta.title, client_id: clientId });
        const response = await fetch('/api/ratings?' + params.toString());
        if (!response.ok) throw new Error('ratings fetch failed: ' + response.status);
        updateRatingDisplay(await response.json());
      } catch (error) {
        console.error('Error fetching ratings:', error);
      }
    }

    async function rateTrack(rating) {
      if (!lastMeta || !lastMeta.artist || !lastMeta.title) return;
      try {
        const response = await fetch('/api/ratings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ artist: lastMeta.artist, title: lastMeta.title, rating, client_id: clientId })
        });
        if (response.status === 409) {
          // Already voted (e.g. duplicate click) - resync display from server state.
          refreshRatings(lastMeta);
          return;
        }
        if (!response.ok) throw new Error('rating post failed: ' + response.status);
        updateRatingDisplay(await response.json());
      } catch (error) {
        console.error('Error submitting rating:', error);
      }
    }

    pollMetadata();
    setInterval(pollMetadata, 10000);

    initializeStream();
  </script>
</body>
</html>
