<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio Calico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/radio.css">
</head>
<body>
  <header>
    <img src="/radio-calico-logo.png" alt="Radio Calico logo">
    <span class="brand">Radio <span class="accent">Calico</span></span>
  </header>

  <main>
    <div class="now-playing">
      <img id="albumArt" class="album-art" alt="Album art">

      <div class="track-info">
        <h1 id="trackTitle">Loading track info…</h1>
        <h2 id="trackAlbum"></h2>

        <p class="quality-info" id="sourceQuality">Source quality: —</p>
        <p class="quality-info" id="streamQuality">Stream quality: 48kHz FLAC / HLS Lossless</p>

        <div class="rating">
          <span>Rate this track:</span>
          <button type="button" id="thumbsUpButton" aria-label="Thumbs up" onclick="rateTrack('up')">👍 <span class="count" id="thumbsUpCount">0</span></button>
          <button type="button" id="thumbsDownButton" aria-label="Thumbs down" onclick="rateTrack('down')">👎 <span class="count" id="thumbsDownCount">0</span></button>
        </div>

        <div class="player-card">
          <button id="playButton" class="play-button" onclick="togglePlayPause()">▶</button>

          <div class="status-time">
            <span id="status" class="status">Initializing...</span>
            <span id="timeDisplay" title="Elapsed time on this track">Elapsed: --:--</span>
          </div>

          <div class="volume-control">
            <span aria-hidden="true">🔊</span>
            <input type="range" id="volume" min="0" max="100" value="100" onchange="setVolume()">
            <span id="volumeLevel" class="volume-level">100%</span>
          </div>

          <audio id="player" crossorigin="anonymous"></audio>
        </div>
      </div>
    </div>

    <div class="previous-tracks">
      <h3>Previous tracks:</h3>
      <ul id="previousTracksList">
        <li class="empty-message">Keep listening — tracks will appear here as they play.</li>
      </ul>
    </div>

    <div class="link-to-home">
      <a href="/">← Back to prototype</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <!-- Classic scripts share one global scope; order matters. main.js starts everything. -->
  <script src="/js/radio/player.js"></script>
  <script src="/js/radio/ratings.js"></script>
  <script src="/js/radio/metadata.js"></script>
  <script src="/js/radio/main.js"></script>
</body>
</html>
